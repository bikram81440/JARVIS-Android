name: JARVIS Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build JARVIS Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The project currently does not contain gradle-wrapper.jar.
      # Install the exact Gradle version declared by the project and
      # invoke Gradle directly so GitHub Actions does not depend on the
      # missing wrapper JAR.
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-debug.apk

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v6
        with:
          name: JARVIS-debug-apk
          path: JARVIS-debug.apk
          if-no-files-found: error
          retention-days: 14
