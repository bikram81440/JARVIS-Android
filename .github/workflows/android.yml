name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Verify project files
        run: |
          echo "Checking Android project..."
          test -f gradlew
          test -d app
          test -f app/build.gradle.kts
          echo "Project structure OK"

      - name: Create google-services.json
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: FIREBASE_GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi

          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json

          echo "google-services.json created for build."

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Clean previous build
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove Firebase config
        if: always()
        run: |
          rm -f app/google-services.json
